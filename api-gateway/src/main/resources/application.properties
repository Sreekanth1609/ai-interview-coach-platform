spring.application.name=api-gateway
server.port=8085

logging.level.org.springframework.cloud.gateway=DEBUG

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=https://user-service-b2xn.onrender.com/
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# INTERVIEW SERVICE
spring.cloud.gateway.routes[1].id=interview-service
spring.cloud.gateway.routes[1].uri=http://interview-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**


jwt.secret=${JWT_SECRET}


#Allow cross-origin to frontend to access urls

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true