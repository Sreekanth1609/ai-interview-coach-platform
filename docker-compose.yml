version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_service

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  user-service:
    build: ./user-service
    container_name: user-service

    ports:
      - "8081:8081"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway

    ports:
      - "8085:8085"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000

    depends_on:
      - user-service

  interview-service:
    build: ./interview-service

    ports:
      - "8082:8082"

    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      GROQ_API_KEY: ${GROQ_API_KEY}

    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  mysql_data:
  mongo_data: